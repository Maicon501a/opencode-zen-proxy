name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Node proxy: test suite + lint
  # ---------------------------------------------------------------------------
  proxy:
    name: proxy (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Jest
        run: npx jest --ci

      - name: ESLint
        run: npx eslint src

  # ---------------------------------------------------------------------------
  # Desktop app: Wails build for Windows + Linux
  # ---------------------------------------------------------------------------
  desktop:
    name: desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-amd64
          - os: ubuntu-24.04
            name: linux-amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Add Go bin to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Stage embedded proxy copy
        shell: bash
        run: |
          mkdir -p desktop/tools/proxy-src/src
          cp -r src/. desktop/tools/proxy-src/src/
          cp package.json desktop/tools/proxy-src/
          cd desktop/tools/proxy-src
          npm install --omit=dev --no-audit --no-fund --loglevel=error

      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: desktop
        run: wails build -clean

      - name: Build (Linux)
        if: runner.os == 'Linux'
        working-directory: desktop
        run: wails build -clean -tags webkit2_41

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path desktop/build/bin/OpenCodeZenDesktop.exe `
            -DestinationPath dist/OpenCodeZenDesktop-windows-amd64.zip
          Copy-Item desktop/build/bin/OpenCodeZenDesktop.exe `
            dist/OpenCodeZenDesktop-windows-amd64.exe

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -C desktop/build/bin -czf dist/OpenCodeZenDesktop-linux-amd64.tar.gz OpenCodeZenDesktop

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCodeZenDesktop-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Release: attach both builds to the GitHub release on version tags
  # ---------------------------------------------------------------------------
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [proxy, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Downloads

            | Plataforma | Arquivo | Como usar |
            |---|---|---|
            | Windows | `OpenCodeZenDesktop-windows-amd64.exe` | baixe e execute direto — sem extrair |
            | Windows | `OpenCodeZenDesktop-windows-amd64.zip` | descompacte e execute o `OpenCodeZenDesktop.exe` |
            | Linux | `OpenCodeZenDesktop-linux-amd64.tar.gz` | `tar -xzf` e execute `./OpenCodeZenDesktop` (requer `libwebkit2gtk-4.1`) |
            | Qualquer | `proxy-source.zip` | proxy Node puro, sem o app (`npm install && npm start`) |

            **Pré-requisito:** Node.js 18+ no PATH — o app sobe o proxy embutido com ele.

      - name: Attach proxy source zip to the release
        run: |
          zip -r proxy-source.zip src package.json pnpm-lock.yaml .env.example docs README.md LICENSE -x "**/node_modules/**"
          gh release upload "$GITHUB_REF_NAME" proxy-source.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
